[project]
name = "scaling"
version = "0.1.0"
description = "Inference/training time and memory scaling laws for ResNet-50 and ViT-S"
readme = "README.md"
# torch publishes no wheels for 3.14 yet; 3.10-3.12 are the safe range.
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.1",
]

[project.scripts]
scaling-bench = "scaling.benchmark:main"
scaling-sweep = "scaling.sweep:main"
scaling-aggregate = "scaling.aggregate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scaling"]
